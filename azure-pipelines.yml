trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:

  # ---------------------------------------------------------------------------
  # Stage 1: Compile
  # ---------------------------------------------------------------------------
  - stage: Compile
    displayName: 'Compile'
    jobs:
      - job: Compile
        displayName: 'Compile application'
        steps:
          - script: |
              echo "Compile stage - placeholder"
              echo "No application compilation is required for this test framework."
            displayName: 'Compile placeholder'


  # ---------------------------------------------------------------------------
  # Stage 2: Build
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: 'Build'
    dependsOn: Compile
    jobs:
      - job: Build
        displayName: 'Build application'
        steps:
          - script: |
              echo "Build stage - placeholder"
              echo "Build process would be implemented here for a real application."
            displayName: 'Build placeholder'


  # ---------------------------------------------------------------------------
  # Stage 3: Test
  # ---------------------------------------------------------------------------
  - stage: Test
    displayName: 'Run Playwright Tests'
    dependsOn: Build
    jobs:
      - job: PlaywrightTests
        displayName: 'Run Playwright tests'
        steps:

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            displayName: 'Install project dependencies'

          - script: npx playwright install --with-deps chromium
            displayName: 'Install Chromium and dependencies'

          - script: npm test
            displayName: 'Run Playwright tests'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Playwright report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'playwright-report'


  # ---------------------------------------------------------------------------
  # Stage 4: Deploy
  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: 'Deploy application'
        steps:
          - script: |
              echo "Deploy stage - placeholder"
              echo "Actual deployment would be implemented here."
            displayName: 'Deploy placeholder'